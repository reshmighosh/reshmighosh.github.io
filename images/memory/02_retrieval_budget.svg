<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" style="max-width:100%;height:auto" role="img" aria-labelledby="title description">
<title id="title">What changes when retrieval gets bigger?</title>
<desc id="description">Measured cue counts across eight synthetic requests at retrieval budgets 1, 2, 4, and 8. Two panels compare lexical retrieval with a hand-annotated metadata control. Each stacked segment is labeled by category; these are not LLM performance results.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b44}.small{font-size:17px}.body{font-size:21px}.heading{font-size:26px;font-weight:700}.title{font-size:37px;font-weight:700}.muted{fill:#52657b}</style>
<rect width="1200" height="100%" fill="#f5f7fb"/>
<text x="48" y="47" class="small muted">SYNTHETIC CASE STUDY  /  MEMORY &amp; PROVENANCE</text>
<text x="48" y="101" class="title">What changes when retrieval gets bigger?</text>
<text x="48" y="143" class="body muted">Selected cue-request pairs across 8 requests; up to k positive-score cues per request.</text>
<rect x="48" y="174" width="20" height="20" rx="12" fill="#147d73" stroke="#147d73"/>
<text x="78" y="190" class="small">Eligible</text>
<rect x="290" y="174" width="20" height="20" rx="12" fill="#94620b" stroke="#94620b"/>
<text x="320" y="190" class="small">Superseded</text>
<rect x="580" y="174" width="20" height="20" rx="12" fill="#6b60a8" stroke="#6b60a8"/>
<text x="610" y="190" class="small">Wrong subject</text>
<rect x="48" y="210" width="20" height="20" rx="12" fill="#60758b" stroke="#60758b"/>
<text x="78" y="226" class="small">Out of scope</text>
<rect x="290" y="210" width="20" height="20" rx="12" fill="#bd4655" stroke="#bd4655"/>
<text x="320" y="226" class="small">Prohibited</text>
<text x="60" y="290" class="heading">Lexical relevance only</text>
<text x="60" y="320" class="small muted">No subject, time, or reuse checks</text>
<line x1="95" y1="735.0" x2="518" y2="735.0" stroke="#dce3ed" stroke-width="2"/>
<text x="83" y="741.0" class="small muted" text-anchor="end">0</text>
