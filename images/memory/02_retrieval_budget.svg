<text x="83" y="556.0" class="small muted" text-anchor="end">20</text>
<line x1="95" y1="457.5" x2="518" y2="457.5" stroke="#dce3ed" stroke-width="2"/>
<text x="83" y="463.5" class="small muted" text-anchor="end">30</text>
